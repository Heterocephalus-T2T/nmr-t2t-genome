# conf/circos.conf

# command line: circos -conf conf/circos.conf -outputdir out -outputfile mHetGla_tracks.png

<<include ../etc/colors_fonts_patterns.conf>>
<<include ../etc/housekeeping.conf>>

<colors>
satcen  = 136,23,152
satperi = 150,75,20
satrrna = 34,139,34
sat5s   = 190,30,140
# collision-free additions (Jul 16): keep intra=blue / inter=orange for the SD links,
# so the outer highlights + the TE line get their own hues instead of reusing blue/orange.
telocol = 218,165,32
telostk = 160,120,10
newcol  = 224,60,132
tecol   = 0,128,128
</colors>



karyotype = ../data/karyotype.txt

chromosomes_units = 1000000
chromosomes_display_default = yes

# If you want to restrict to certain chroms:
# chromosomes = chr1;chr2;chr3;...;chrX;chrY

<image>
<<include ../etc/image.conf>>
# optional:
# file* = circos.png
# dir*  = ../out
</image>

################################################################
# IDEOGRAM
################################################################
<ideogram>
<spacing>
default = 0.005r
</spacing>

radius           = 0.92r
thickness        = 18p
fill             = yes
fill_color       = lgrey
stroke_thickness = 1
stroke_color     = black

show_label       = yes
label_font       = default
label_radius     = dims(ideogram,radius_outer) + 0.03r
label_size       = 18
label_parallel   = yes
</ideogram>

################################################################
# TICKS
################################################################
show_ticks       = yes
show_tick_labels = yes

<ticks>
radius = dims(ideogram,radius_outer)

multiplier = 1e-6
format = %d

<tick>
spacing = 10u
size = 10p
thickness = 2p
color = black
show_label = yes
label_size = 14p
label_offset = 5p
format = %d
</tick>

<tick>
spacing = 2u
size = 6p
thickness = 1p
color = grey
show_label = no
</tick>
</ticks>

################################################################
# PLOTS (TRACKS)
################################################################
# If you keep many points, you may need to increase this:
max_points_per_track* = 500000

<plots>

# Telomere caps - telomeric satellites TRC2 / TRC13 (end-proximal, merged)
# gold (not blue) so it doesn't clash with the intra-chromosomal SD links
<plot>
type = highlight
file = ../data/telomere_satellite.txt
r1   = 0.985r
r0   = 0.963r
fill_color       = telocol
stroke_color     = telostk
stroke_thickness = 2
</plot>

# New sequence added vs mHetGlaV3
# rose (not orange) so it doesn't clash with the inter-chromosomal SD links
<plot>
type = highlight
file = ../data/newseq.highlight.txt
r1   = 0.960r
r0   = 0.942r
fill_color   = newcol
stroke_color = newcol
stroke_thickness = 1
</plot>

# Centromere region highlight
<plot>
type = highlight
file = ../data/centromere.highlight.txt
r1   = 0.940r
r0   = 0.922r
fill_color   = red_a4
stroke_color = red
stroke_thickness = 1
</plot>

# Gene density - heatmap
<plot>
type  = heatmap
file  = ../data/gene_density.txt
r1    = 0.918r
r0    = 0.80r
min   = 0
max   = 1
color = blues-9-seq
</plot>

# TE / repeat density
# teal single colour + thickness 2 - a Brewer palette name (spectral-9-seq) does not
# apply to a line track, so it silently rendered black and collided with the GC line
<plot>
type      = line
file      = ../data/te_density.txt
r1        = 0.79r
r0        = 0.74r
min       = 0
max       = 1
color     = tecol
thickness = 2
</plot>

# GC content
<plot>
type      = line
file      = ../data/gc_content.txt
r1        = 0.73r
r0        = 0.66r
min       = 0
max       = 1
color     = black
thickness = 2
</plot>

# Heterozygosity (rescaled max 30 to reveal the per-chromosome gradient; rare spikes clip)
<plot>
type       = histogram
file       = ../data/heterozygosity.txt
r1         = 0.65r
r0         = 0.575r
min        = 0
max        = 30
fill_color = grey_a3
color      = grey_a3
thickness  = 0
</plot>

# Satellite families (Dmitry TRC GFFs) by role: centromeric/peritelomeric/rRNA/5S
<plot>
type = highlight
file = ../data/satellite_families.txt
r1   = 0.565r
r0   = 0.475r
stroke_thickness = 4
</plot>

# CENPA peaks (signalValue)
<plot>
type       = histogram
file       = ../data/cenpa_peaks.txt
r1         = 0.465r
r0         = 0.39r
min        = 0
max        = 80
fill_color = red_a3
color      = red_a3
thickness  = 0
</plot>

</plots>

################################################################
# LINKS (SD)
################################################################
<links>

<link>
file          = ../data/sedef_intra_100kb.txt
radius        = 0.38r
bezier_radius = 0.10r
color         = blue_a2
thickness     = 1
</link>

<link>
file          = ../data/sedef_inter_100kb.txt
radius        = 0.38r
bezier_radius = 0.10r
color         = orange_a2
thickness     = 1
</link>

</links>